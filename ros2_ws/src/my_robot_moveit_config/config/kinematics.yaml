# Only for interactive dragging in RViz (SPEC 11.3). The pick/place pipeline never calls it:
# it uses the analytic IK in my_robot_manipulation, because a 4-DOF arm cannot match the full
# 6-DOF pose goals a generic solver expects. position_only_ik ignores the orientation.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
