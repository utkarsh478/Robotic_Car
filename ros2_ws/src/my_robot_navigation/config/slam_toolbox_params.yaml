# slam_toolbox (online async, mapping). Copied from the Humble default
# /opt/ros/humble/share/slam_toolbox/config/mapper_params_online_async.yaml, then edited
# (CLAUDE.md rule 3). gate_p03.sh diffs the key set against the installed default and
# flags any key that does not exist there. Changes from the default are marked  # CHANGED.
slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint          # CHANGED (default base_footprint/base_link): SPEC §4
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02      # 50 Hz map->odom
    map_update_interval: 2.0            # CHANGED (5.0): faster map updates in RViz
    resolution: 0.05
    max_laser_range: 12.0               # CHANGED (20.0): = sensor max range (SPEC §3.2)
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2        # CHANGED (0.5): more scans in an 8 x 6 m room
    minimum_travel_heading: 0.3         # CHANGED (0.5): 180 deg lidar needs more scans while turning
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false              # CHANGED (true): P3 run 3 had a false loop closure at
                                        # t_sim 141 s that snapped the pose 2.8 m (right zone ->
                                        # middle zone, look-alike corridors). One 8x6 m room needs
                                        # no loop closure; on a large real site re-enable it.
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.3   # CHANGED (0.5): scan match within +/-0.15 m of odometry
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # Karto scales each match by 1 - 0.2*d^2/variance (clamped below by minimum_*_penalty).
    # Defaults (0.5, 1.0) barely penalise disagreeing with odometry: a 10 cm offset costs 0.4 %,
    # so in long corridors (degenerate along their axis for a 180 deg lidar) the pose crept
    # 0.12 m away from truth while odometry was exact (P2: 0.0 % error). Smaller variance =
    # stronger pull to odometry: 10 cm now costs 20 %, 20 cm 80 % (clamped at 0.2).
    distance_variance_penalty: 0.01     # CHANGED (0.5)
    angle_variance_penalty: 0.05        # CHANGED (1.0)
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.5          # CHANGED (0.9)
    minimum_distance_penalty: 0.2       # CHANGED (0.5)
    use_response_expansion: true
